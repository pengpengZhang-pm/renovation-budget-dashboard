<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>装修预算仪表盘</title>
  <style>
    :root {
      --ink: #07111f;
      --muted: #62738c;
      --line: rgba(77, 151, 232, .22);
      --panel: rgba(255, 255, 255, .78);
      --blue: #0a84ff;
      --blue-deep: #0757b7;
      --bg: #f5fbff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eaf6ff 0%, #f8fcff 42%, #fff 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(10,132,255,.06) 1px, transparent 1px),
        linear-gradient(180deg, rgba(10,132,255,.05) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(180deg, black 0%, transparent 60%);
    }
    main {
      position: relative;
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: .96;
      letter-spacing: 0;
    }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.68);
      color: var(--muted);
      padding: 10px 14px;
      font-size: 13px;
      white-space: nowrap;
      backdrop-filter: blur(18px);
    }
    .metrics {
      display: grid;
      grid-template-columns: 1.35fr repeat(3, minmax(150px, 1fr));
      gap: 12px;
      margin: 20px 0 14px;
    }
    .card, section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(14,82,155,.12);
      backdrop-filter: blur(18px);
    }
    .card { padding: 18px; min-height: 112px; }
    .card.primary {
      color: #fff;
      background: linear-gradient(135deg, rgba(10,132,255,.98), rgba(5,87,194,.92));
      border: 0;
    }
    .card span { display: block; color: var(--muted); font-size: 13px; }
    .card.primary span { color: rgba(255,255,255,.8); }
    .card strong {
      display: block;
      margin-top: 10px;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    section { margin-top: 14px; overflow: hidden; }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .head-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    h2 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .hint { color: var(--muted); font-size: 13px; }
    .collapse-btn {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(10,132,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      color: var(--blue-deep);
      padding: 0;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .section-body { display: block; }
    section.collapsed .section-body { display: none; }
    section.collapsed .collapse-btn { transform: rotate(-90deg); }
    .bars { display: grid; gap: 12px; padding: 16px 18px 18px; }
    .bar-row {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 116px;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .track { height: 10px; border-radius: 999px; background: rgba(10,132,255,.10); overflow: hidden; }
    .fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), rgba(10,132,255,.48)); }
    .amount { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .todo-layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 12px;
      padding: 14px;
    }
    .stack { display: grid; gap: 8px; align-content: start; }
    .mini {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.66);
      padding: 11px 12px;
    }
    .mini span { display: block; color: var(--muted); font-size: 12px; }
    .mini strong { display: block; margin-top: 7px; font-size: 21px; letter-spacing: 0; }
    .todo-list { display: block; }
    .todo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .todo-group {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .todo-group summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 0 10px;
      list-style-position: inside;
    }
    .todo {
      border: 1px solid rgba(10,132,255,.16);
      border-radius: 8px;
      background: rgba(255,255,255,.70);
      padding: 9px 10px;
      min-height: 74px;
    }
    .todo.done { opacity: .58; background: rgba(255,255,255,.46); }
    .todo-title { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
    .todo-title strong { line-height: 1.25; font-size: 14px; }
    .todo-amount { color: var(--blue-deep); font-weight: 750; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      border-radius: 999px;
      border: 1px solid rgba(10,132,255,.13);
      background: rgba(10,132,255,.07);
      color: #205d9f;
      padding: 3px 8px;
      font-size: 12px;
      white-space: nowrap;
    }
    footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 150px 150px 128px;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    input, select, .toolbar button {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      color: var(--ink);
      padding: 0 13px;
      font: inherit;
      font-size: 14px;
    }
    .toolbar button {
      cursor: pointer;
      font-weight: 650;
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .table-wrap { overflow: auto; max-height: 620px; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(77,151,232,.14);
      text-align: left;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(247,251,255,.96);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    tr:hover td { background: rgba(10,132,255,.035); }
    .money { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
    .item-cell { max-width: 430px; line-height: 1.35; }
    .shop { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .empty { padding: 34px 16px; text-align: center; color: var(--muted); }
    .cashback-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 18px 18px;
    }
    .cashback-card {
      border: 1px solid rgba(10,132,255,.16);
      border-radius: 8px;
      background: rgba(255,255,255,.70);
      padding: 12px;
    }
    .cashback-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .cashback-title strong { font-size: 15px; }
    .cashback-amount { color: var(--blue-deep); font-weight: 800; white-space: nowrap; }
    .cashback-action { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    @media (max-width: 840px) {
      main { width: min(100% - 20px, 1120px); padding-top: 24px; }
      header { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .card.primary { grid-column: 1 / -1; }
      .grid, .todo-layout { grid-template-columns: 1fr; }
      .todo-grid { grid-template-columns: 1fr; }
      .cashback-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar input { grid-column: 1 / -1; }
      table { min-width: 760px; }
    }
    @media (max-width: 520px) {
      .metrics { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 78px minmax(0, 1fr) 98px; }
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <main>
    <header>
      <div>
        <h1>装修预算仪表盘</h1>
        <p>公开分享版：保留预算结构、待买计划和购买明细，隐藏交易编号和内部备注。</p>
      </div>
      <div class="pill">更新：<strong id="updated"></strong></div>
    </header>

    <div class="metrics">
      <article class="card primary"><span>实际支出</span><strong id="total"></strong></article>
      <article class="card"><span>记录数</span><strong id="count"></strong></article>
      <article class="card"><span>软装可分配</span><strong id="available"></strong></article>
      <article class="card"><span>Todo 剩余</span><strong id="remaining"></strong></article>
    </div>

    <div class="grid">
      <section class="collapsible">
        <div class="head">
          <div class="head-title"><h2>费用大类</h2><span class="hint">按实际支出排序</span></div>
          <button class="collapse-btn" type="button" aria-label="折叠费用大类" aria-expanded="true">⌄</button>
        </div>
        <div class="section-body">
          <div id="categoryBars" class="bars"></div>
        </div>
      </section>
      <section class="collapsible">
        <div class="head">
          <div class="head-title"><h2>空间分布</h2><span class="hint">按实际支出排序</span></div>
          <button class="collapse-btn" type="button" aria-label="折叠空间分布" aria-expanded="true">⌄</button>
        </div>
        <div class="section-body">
          <div id="spaceBars" class="bars"></div>
        </div>
      </section>
    </div>

    <section class="collapsible">
      <div class="head">
        <div class="head-title"><h2>购买 Todo</h2><span id="todoHint" class="hint"></span></div>
        <button class="collapse-btn" type="button" aria-label="折叠购买 Todo" aria-expanded="true">⌄</button>
      </div>
      <div class="section-body">
        <div class="todo-layout">
          <div class="stack">
            <div class="mini"><span>总装修预算</span><strong id="totalBudget"></strong></div>
            <div class="mini"><span>硬装预留</span><strong id="hardReserve"></strong></div>
            <div class="mini"><span>Todo 已分配</span><strong id="allocated"></strong></div>
            <div id="todoSpaceBars" class="bars"></div>
          </div>
          <div id="todoList" class="todo-list"></div>
        </div>
      </div>
    </section>

    <section class="collapsible">
      <div class="head">
        <div class="head-title"><h2>返现提醒</h2><span id="cashbackHint" class="hint"></span></div>
        <button class="collapse-btn" type="button" aria-label="折叠返现提醒" aria-expanded="true">⌄</button>
      </div>
      <div class="section-body">
        <div id="cashbackList" class="cashback-grid"></div>
      </div>
    </section>

    <section class="collapsible">
      <div class="head">
        <div class="head-title"><h2>购买明细</h2><span id="resultCount" class="hint"></span></div>
        <button class="collapse-btn" type="button" aria-label="折叠购买明细" aria-expanded="true">⌄</button>
      </div>
      <div class="section-body">
        <div class="toolbar">
          <input id="search" type="search" placeholder="搜索商品、店铺" />
          <select id="categoryFilter"><option value="">全部费用大类</option></select>
          <select id="spaceFilter"><option value="">全部空间</option></select>
          <button id="reset">重置筛选</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>商品/项目</th>
                <th>费用大类</th>
                <th>空间</th>
                <th>来源</th>
                <th class="money">金额</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty" class="empty" hidden>没有符合筛选条件的记录</div>
        </div>
      </div>
    </section>

    <footer>数据来自个人装修预算表。此页面为公开分享版，不包含交易编号和内部备注。</footer>
  </main>

  <script>
    const data = JSON.parse(document.getElementById('budget-data').textContent);
    const money = value => new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(value || 0);
    const pct = value => `${(value * 100).toFixed(1)}%`;
    document.getElementById('updated').textContent = data.meta.updated;
    document.getElementById('total').textContent = money(data.meta.total);
    document.getElementById('count').textContent = `${data.meta.count} 笔`;
    document.getElementById('available').textContent = money(data.meta.todoAvailable);
    document.getElementById('remaining').textContent = money(data.meta.todoRemaining);
    document.getElementById('totalBudget').textContent = money(data.meta.totalBudget);
    document.getElementById('hardReserve').textContent = money(data.meta.hardReserve);
    document.getElementById('allocated').textContent = money(data.meta.todoAllocated);
    document.getElementById('todoHint').textContent = `${data.meta.todoPendingCount} 项待买`;
    document.getElementById('cashbackHint').textContent = `${data.meta.cashbackCount} 项 · 预计 ${money(data.meta.cashbackTotal)}`;

    function bars(target, items) {
      const max = Math.max(...items.map(item => item.amount), 1);
      document.getElementById(target).innerHTML = items.map(item => `
        <div class="bar-row">
          <div class="name" title="${item.name}">${item.name}</div>
          <div class="track"><div class="fill" style="width:${Math.max(1, item.amount / max * 100)}%"></div></div>
          <div class="amount">${money(item.amount)} · ${pct(item.pct)}</div>
        </div>
      `).join('');
    }

    function renderTodo() {
      bars('todoSpaceBars', data.todoSpaces);
      const priorityRank = { '高': 0, '中': 1, '低': 2 };
      const statusRank = { '待购买': 0, '部分已购买': 1, '已购买': 2 };
      const rows = [...data.todoRows].sort((a, b) =>
        (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9)
        || (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9)
        || b.budget - a.budget
      );
      const activeRows = rows.filter(row => row.status !== '已购买');
      const doneRows = rows.filter(row => row.status === '已购买');
      const card = row => `
        <article class="todo ${row.status === '已购买' ? 'done' : ''}">
          <div class="todo-title">
            <strong>${row.item}</strong>
            <span class="todo-amount">${row.budget ? money(row.budget) : '已购买'}</span>
          </div>
          <div class="tags">
            <span class="tag">${row.space}</span>
            <span class="tag">${row.category}</span>
            <span class="tag">${row.status}</span>
            <span class="tag">优先级${row.priority}</span>
          </div>
        </article>
      `;
      document.getElementById('todoList').innerHTML = `
        <div class="todo-grid">${activeRows.map(card).join('')}</div>
        <details class="todo-group">
          <summary>已购买 ${doneRows.length} 项</summary>
          <div class="todo-grid">${doneRows.map(card).join('')}</div>
        </details>
      `;
    }

    function renderCashback() {
      document.getElementById('cashbackList').innerHTML = data.cashbackRows.map(row => `
        <article class="cashback-card">
          <div class="cashback-title">
            <strong>${row.item}</strong>
            <span class="cashback-amount">${money(row.amount)}</span>
          </div>
          <div class="tags">
            <span class="tag">${row.space}</span>
            <span class="tag">${row.status}</span>
            <span class="tag">${row.trigger}</span>
          </div>
          <div class="cashback-action">${row.action}</div>
        </article>
      `).join('');
    }

    const search = document.getElementById('search');
    const categoryFilter = document.getElementById('categoryFilter');
    const spaceFilter = document.getElementById('spaceFilter');
    const tbody = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const resultCount = document.getElementById('resultCount');

    function optionList(select, values) {
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
    }

    optionList(categoryFilter, [...new Set(data.rows.map(row => row.category))].sort());
    optionList(spaceFilter, [...new Set(data.rows.map(row => row.space))].sort());

    function renderRows() {
      const query = search.value.trim().toLowerCase();
      const category = categoryFilter.value;
      const space = spaceFilter.value;
      const filtered = data.rows.filter(row => {
        const text = `${row.name} ${row.shop} ${row.category} ${row.space}`.toLowerCase();
        return (!query || text.includes(query))
          && (!category || row.category === category)
          && (!space || row.space === space);
      });
      resultCount.textContent = `${filtered.length} 笔，${money(filtered.reduce((sum, row) => sum + row.amount, 0))}`;
      empty.hidden = filtered.length > 0;
      tbody.innerHTML = filtered.map(row => `
        <tr>
          <td>${row.date || '未填日期'}</td>
          <td class="item-cell">
            <strong>${row.name}</strong>
            <div class="shop">${row.shop || '手动记录'}</div>
          </td>
          <td><span class="tag">${row.category}</span></td>
          <td><span class="tag">${row.space}</span></td>
          <td><span class="tag">${row.source}</span></td>
          <td class="money">${money(row.amount)}</td>
        </tr>
      `).join('');
    }

    for (const control of [search, categoryFilter, spaceFilter]) {
      control.addEventListener('input', renderRows);
      control.addEventListener('change', renderRows);
    }

    document.getElementById('reset').addEventListener('click', () => {
      search.value = '';
      categoryFilter.value = '';
      spaceFilter.value = '';
      renderRows();
    });

    for (const button of document.querySelectorAll('.collapse-btn')) {
      button.addEventListener('click', () => {
        const section = button.closest('section');
        const collapsed = section.classList.toggle('collapsed');
        button.setAttribute('aria-expanded', String(!collapsed));
      });
    }

    bars('categoryBars', data.categories);
    bars('spaceBars', data.spaces);
    renderTodo();
    renderCashback();
    renderRows();
  </script>
</body>
