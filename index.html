<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>装修预算表</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #07111f;
      --muted: #607089;
      --subtle: #8aa0bb;
      --line: rgba(119, 170, 226, .26);
      --paper: #f6fbff;
      --panel: rgba(255, 255, 255, .78);
      --accent: #0a84ff;
      --accent-deep: #0557c2;
      --accent-soft: rgba(10, 132, 255, .10);
      --track: rgba(10, 132, 255, .10);
      --shadow: 0 24px 70px rgba(14, 82, 155, .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #edf7ff 0%, #f7fbff 42%, #ffffff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(10, 132, 255, .07) 1px, transparent 1px),
        linear-gradient(180deg, rgba(10, 132, 255, .055) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, black 0%, transparent 58%);
    }

    .app {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 38px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(34px, 6vw, 64px);
      line-height: .96;
      letter-spacing: 0;
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .updated {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .64);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      border-radius: 999px;
      backdrop-filter: blur(18px);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1.35fr repeat(3, minmax(145px, 1fr));
      gap: 12px;
      margin: 20px 0 14px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(14, 82, 155, .08);
      min-height: 112px;
      backdrop-filter: blur(22px);
    }

    .metric strong {
      display: block;
      margin-top: 10px;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.02;
      letter-spacing: 0;
      font-weight: 700;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    .metric.primary {
      color: white;
      background:
        linear-gradient(135deg, rgba(10, 132, 255, .98) 0%, rgba(5, 87, 194, .92) 100%);
      border: 0;
      box-shadow: 0 22px 58px rgba(10, 132, 255, .28);
    }

    .metric.primary span { color: rgba(255, 255, 255, .78); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
      font-weight: 650;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .bars {
      padding: 14px 18px 18px;
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 114px;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }

    .bar-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .bar-track {
      height: 10px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(10, 132, 255, .05);
    }

    .bar-fill {
      height: 100%;
      min-width: 2px;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--bar-color), rgba(10, 132, 255, .54));
      box-shadow: 0 0 18px rgba(10, 132, 255, .26);
    }

    .bar-amount {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .donut-wrap {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 12px;
      padding: 18px;
      align-items: center;
    }

    .donut {
      width: 190px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(var(--segments));
      position: relative;
      margin: auto;
      box-shadow:
        inset 0 0 0 1px rgba(10, 132, 255, .12),
        0 18px 44px rgba(10, 132, 255, .13);
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .88);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .legend {
      display: grid;
      gap: 9px;
      font-size: 13px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--swatch);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 150px 150px 128px;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(210, 210, 215, .62);
    }

    input, select, button {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      color: var(--ink);
      padding: 0 13px;
      font: inherit;
      font-size: 14px;
    }

    input:focus, select:focus, button:focus {
      outline: 3px solid rgba(0, 113, 227, .18);
      border-color: rgba(0, 113, 227, .55);
    }

    button {
      cursor: pointer;
      font-weight: 650;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 10px 24px rgba(10, 132, 255, .22);
    }

    .table-wrap {
      overflow: auto;
      max-height: 640px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #ececf0;
      vertical-align: top;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(247, 251, 255, .96);
      z-index: 1;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
      font-weight: 650;
    }

    tr:hover td { background: rgba(10, 132, 255, .035); }

    .money {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    .name-cell {
      max-width: 430px;
      line-height: 1.35;
    }

    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      background: rgba(10, 132, 255, .07);
      color: #205d9f;
      border: 1px solid rgba(10, 132, 255, .13);
      white-space: nowrap;
    }

    .tag.source-manual { background: rgba(7, 17, 31, .06); color: #07111f; border-color: rgba(7, 17, 31, .09); }
    .tag.source-online { background: rgba(10, 132, 255, .07); color: #205d9f; }

    .todo-section {
      margin-top: 14px;
    }

    .todo-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 12px;
      padding: 14px;
    }

    .budget-stack {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .budget-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .64);
      padding: 11px 12px;
    }

    .budget-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .budget-card strong {
      display: block;
      margin-top: 7px;
      font-size: 21px;
      letter-spacing: 0;
    }

    .todo-space-bars {
      display: grid;
      gap: 8px;
    }

    .todo-list {
      display: block;
      max-height: 620px;
      overflow: auto;
      padding-right: 4px;
    }

    .todo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .todo-group {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .todo-group summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 0 10px;
      list-style-position: inside;
    }

    .todo-card {
      border: 1px solid rgba(10, 132, 255, .16);
      border-radius: 8px;
      background: rgba(255, 255, 255, .70);
      padding: 9px 10px;
      min-height: 84px;
    }

    .todo-card.done {
      opacity: .62;
      background: rgba(255, 255, 255, .48);
    }

    .todo-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }

    .todo-title strong {
      line-height: 1.25;
      font-size: 14px;
    }

    .todo-note {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.35;
      font-size: 11px;
    }

    .todo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .todo-amount {
      white-space: nowrap;
      font-weight: 700;
      color: var(--accent-deep);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
    }

    .cashback-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 18px 18px;
    }

    .cashback-card {
      border: 1px solid rgba(10, 132, 255, .16);
      border-radius: 8px;
      background: rgba(255, 255, 255, .70);
      padding: 12px;
    }

    .cashback-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .cashback-title strong { font-size: 15px; }
    .cashback-amount { color: var(--accent-deep); font-weight: 800; white-space: nowrap; }
    .cashback-action { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }

    @media (max-width: 860px) {
      .app { width: min(100% - 20px, 1180px); padding-top: 22px; }
      header { grid-template-columns: 1fr; }
      .updated { width: fit-content; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .metric.primary { grid-column: 1 / -1; }
      .grid { grid-template-columns: 1fr; }
      .donut-wrap { grid-template-columns: 1fr; }
      .todo-layout { grid-template-columns: 1fr; }
      .todo-grid { grid-template-columns: 1fr; }
      .cashback-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar input { grid-column: 1 / -1; }
      table { min-width: 760px; }
    }

    @media (max-width: 520px) {
      .metrics { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 74px minmax(0, 1fr) 92px; }
      .metric { min-height: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>装修预算表</h1>
        <p class="subtitle">费用大类 × 空间维度，适合手机查看和日常复盘。</p>
      </div>
      <div class="updated">更新：<strong id="updated"></strong></div>
    </header>

    <div class="metrics">
      <article class="metric primary">
        <span>总支出</span>
        <strong id="total"></strong>
      </article>
      <article class="metric">
        <span>记录数</span>
        <strong id="count"></strong>
      </article>
      <article class="metric">
        <span>线下/手动</span>
        <strong id="manualTotal"></strong>
      </article>
      <article class="metric">
        <span>淘宝/线上</span>
        <strong id="onlineTotal"></strong>
      </article>
    </div>

    <div class="grid">
      <section>
        <div class="section-head">
          <h2>费用大类</h2>
          <span class="hint">按实际支出排序</span>
        </div>
        <div id="categoryBars" class="bars"></div>
      </section>

      <section>
        <div class="section-head">
          <h2>空间分布</h2>
          <span class="hint">全屋与房间占比</span>
        </div>
        <div class="donut-wrap">
          <div id="spaceDonut" class="donut" aria-label="空间支出分布图"></div>
          <div id="spaceLegend" class="legend"></div>
        </div>
      </section>
    </div>

    <section class="todo-section">
      <div class="section-head">
        <h2>购买 Todo</h2>
        <span class="hint" id="todoHint"></span>
      </div>
      <div class="todo-layout">
        <div class="budget-stack">
          <div class="budget-card">
            <span>总装修预算</span>
            <strong id="totalBudget"></strong>
          </div>
          <div class="budget-card">
            <span>硬装未支付预留</span>
            <strong id="hardReserve"></strong>
          </div>
          <div class="budget-card">
            <span>软装/家电可分配</span>
            <strong id="todoAvailable"></strong>
          </div>
          <div class="budget-card">
            <span>Todo 已分配</span>
            <strong id="todoAllocated"></strong>
          </div>
          <div id="todoSpaceBars" class="todo-space-bars"></div>
        </div>
        <div id="todoList" class="todo-list"></div>
      </div>
    </section>

    <section style="margin-top: 12px;">
      <div class="section-head">
        <h2>返现提醒</h2>
        <span class="hint" id="cashbackHint"></span>
      </div>
      <div id="cashbackList" class="cashback-grid"></div>
    </section>

    <section style="margin-top: 12px;">
      <div class="section-head">
        <h2>支出明细</h2>
        <span class="hint" id="resultCount"></span>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索商品、店铺、备注" />
        <select id="categoryFilter"><option value="">全部费用大类</option></select>
        <select id="spaceFilter"><option value="">全部空间</option></select>
        <button id="reset">重置筛选</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>商品/项目</th>
              <th>费用大类</th>
              <th>空间</th>
              <th>来源</th>
              <th class="money">金额</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>没有符合筛选条件的记录</div>
      </div>
    </section>

,"note":"用户补充：返现 270 多，先按 270 记提醒，以实际到账为准","recordedAt":"2026-08-27"},{"item":"书桌","amount":100,"trigger":"收货后评价返现","status":"待收货/待评价返现","action":"收货后评价并确认返现","space":"书房/工作区","note":"用户补充：收到后评价返 100","recordedAt":"2026-08-27"}],"todoSpaces":[{"name":"客餐厅","amount":27200,"pct":0.427661},{"name":"书房","amount":13500,"pct":0.212258},{"name":"厨房","amount":11000,"pct":0.172951},{"name":"衣帽间","amount":6100,"pct":0.095909},{"name":"卧室","amount":3301.77,"pct":0.051913},{"name":"浴室","amount":1300,"pct":0.02044},{"name":"玄关","amount":1200,"pct":0.018867}]}</script>
  <script>
    const data = JSON.parse(document.getElementById('budget-data').textContent);
    const colors = ['#0a84ff', '#2492ff', '#3ea0ff', '#58adff', '#72bbff', '#8cc8ff', '#a6d6ff', '#c0e3ff', '#d9efff'];
    const money = value => new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(value);
    const pct = value => `${(value * 100).toFixed(1)}%`;

    document.getElementById('updated').textContent = data.meta.updated;
    document.getElementById('total').textContent = money(data.meta.total);
    document.getElementById('count').textContent = `${data.meta.count} 笔`;
    document.getElementById('manualTotal').textContent = money(data.meta.manualTotal);
    document.getElementById('onlineTotal').textContent = money(data.meta.onlineTotal);
    document.getElementById('totalBudget').textContent = money(data.meta.totalBudget);
    document.getElementById('hardReserve').textContent = money(data.meta.hardReserve);
    document.getElementById('todoAvailable').textContent = money(data.meta.todoAvailable);
    document.getElementById('todoAllocated').textContent = money(data.meta.todoAllocated);
    document.getElementById('todoHint').textContent = `${data.meta.todoPendingCount} 项待买，预算差额 ${money(data.meta.todoRemaining)}`;
    document.getElementById('cashbackHint').textContent = `${data.meta.cashbackCount} 项，预计 ${money(data.meta.cashbackTotal)}`;

    function renderBars() {
      const max = Math.max(...data.categories.map(item => item.amount));
      document.getElementById('categoryBars').innerHTML = data.categories.map((item, index) => `
        <div class="bar-row">
          <div class="bar-name" title="${item.name}">${item.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, item.amount / max * 100)}%;--bar-color:${colors[index % colors.length]}"></div></div>
          <div class="bar-amount">${money(item.amount)} · ${pct(item.pct)}</div>
        </div>
      `).join('');
    }

    function renderDonut() {
      let start = 0;
      const segments = data.spaces.map((item, index) => {
        const end = start + item.pct * 100;
        const segment = `${colors[index % colors.length]} ${start}% ${end}%`;
        start = end;
        return segment;
      }).join(', ');
      document.getElementById('spaceDonut').style.setProperty('--segments', segments);
      document.getElementById('spaceLegend').innerHTML = data.spaces.map((item, index) => `
        <div class="legend-row">
          <span class="swatch" style="--swatch:${colors[index % colors.length]}"></span>
          <span>${item.name} · ${pct(item.pct)}</span>
          <strong>${money(item.amount)}</strong>
        </div>
      `).join('');
    }

    function renderTodo() {
      const max = Math.max(...data.todoSpaces.map(item => item.amount), 1);
      document.getElementById('todoSpaceBars').innerHTML = data.todoSpaces.map((item, index) => `
        <div class="bar-row">
          <div class="bar-name" title="${item.name}">${item.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, item.amount / max * 100)}%;--bar-color:${colors[index % colors.length]}"></div></div>
          <div class="bar-amount">${money(item.amount)}</div>
        </div>
      `).join('');

      const priorityRank = { '高': 0, '中': 1, '低': 2 };
      const statusRank = { '待购买': 0, '部分已购买': 1, '已购买': 2 };
      const rows = [...data.todoRows].sort((a, b) =>
        (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9)
        || (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9)
        || b.budget - a.budget
      );
      const activeRows = rows.filter(row => row.status !== '已购买');
      const doneRows = rows.filter(row => row.status === '已购买');
      const card = row => `
        <article class="todo-card ${row.status === '已购买' ? 'done' : ''}">
          <div class="todo-title">
            <strong>${row.item}</strong>
            <span class="todo-amount">${row.budget ? money(row.budget) : '已计入'}</span>
          </div>
          <div class="todo-meta">
            <span class="tag">${row.space}</span>
            <span class="tag">${row.category}</span>
            <span class="tag">${row.status}</span>
            <span class="tag">优先级${row.priority}</span>
          </div>
          <div class="todo-note">${row.note}</div>
        </article>
      `;

      document.getElementById('todoList').innerHTML = `
        <div class="todo-grid">${activeRows.map(card).join('')}</div>
        <details class="todo-group">
          <summary>已购买 ${doneRows.length} 项</summary>
          <div class="todo-grid">${doneRows.map(card).join('')}</div>
        </details>
      `;
    }

    function renderCashback() {
      document.getElementById('cashbackList').innerHTML = data.cashbackRows.map(row => `
        <article class="cashback-card">
          <div class="cashback-title">
            <strong>${row.item}</strong>
            <span class="cashback-amount">${money(row.amount)}</span>
          </div>
          <div class="todo-meta">
            <span class="tag">${row.space}</span>
            <span class="tag">${row.status}</span>
            <span class="tag">${row.trigger}</span>
          </div>
          <div class="cashback-action">${row.action} · ${row.note}</div>
        </article>
      `).join('');
    }

    const search = document.getElementById('search');
    const categoryFilter = document.getElementById('categoryFilter');
    const spaceFilter = document.getElementById('spaceFilter');
    const tbody = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const resultCount = document.getElementById('resultCount');

    function optionList(select, values) {
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
    }

    optionList(categoryFilter, [...new Set(data.rows.map(row => row.category))].sort());
    optionList(spaceFilter, [...new Set(data.rows.map(row => row.space))].sort());

    function renderRows() {
      const query = search.value.trim().toLowerCase();
      const category = categoryFilter.value;
      const space = spaceFilter.value;
      const filtered = data.rows.filter(row => {
        const text = `${row.name} ${row.shop} ${row.note} ${row.category} ${row.space}`.toLowerCase();
        return (!query || text.includes(query))
          && (!category || row.category === category)
          && (!space || row.space === space);
      });

      resultCount.textContent = `${filtered.length} 笔，${money(filtered.reduce((sum, row) => sum + row.amount, 0))}`;
      empty.hidden = filtered.length > 0;
      tbody.innerHTML = filtered.map(row => `
        <tr>
          <td>${row.date || '未填日期'}</td>
          <td class="name-cell">
            <strong>${row.name}</strong>
            <div class="hint">${row.shop || '手动记录'}${row.note ? ' · ' + row.note : ''}</div>
          </td>
          <td><span class="tag">${row.category}</span></td>
          <td><span class="tag">${row.space}</span></td>
          <td><span class="tag ${row.source === '线下/手动' ? 'source-manual' : 'source-online'}">${row.source}</span></td>
          <td class="money">${money(row.amount)}</td>
        </tr>
      `).join('');
    }

    for (const control of [search, categoryFilter, spaceFilter]) {
      control.addEventListener('input', renderRows);
      control.addEventListener('change', renderRows);
    }

    document.getElementById('reset').addEventListener('click', () => {
      search.value = '';
      categoryFilter.value = '';
      spaceFilter.value = '';
      renderRows();
    });

    renderBars();
    renderDonut();
    renderTodo();
    renderCashback();
    renderRows();
  </script>
</body>
